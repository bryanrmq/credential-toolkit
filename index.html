<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build OCA bundles, type metadata and issuer metadata for swiyu credentials in your browser." />
    <title>Credential Toolkit</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // The chosen theme, before first paint so it never flashes the other one (src/ui/lib/theme.ts keeps THEME_KEY).
      try {
        var theme = localStorage.getItem('credential-toolkit:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {
        // Unreadable storage: System, which the stylesheet handles.
      }
    </script>
    <style>
      /* Until the stylesheet loads, the browser's own canvas follows the chosen theme too. */
      :root[data-theme='light'] { color-scheme: light; }
      :root[data-theme='dark'] { color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
